name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secretos: gitleaks sobre los commits del push o del PR.
  #
  # Es la red de seguridad del pre-commit de .githooks/: cubre al que no tiene
  # el hook activado o lo salteó. Invariante 5 de CLAUDE.md (RN-66). Los falsos
  # positivos revisados van en .gitleaksignore, con motivo y fecha.
  # fetch-depth: 0 porque la acción necesita el historial para acotar el rango.
  # ---------------------------------------------------------------------------
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Base de datos: levanta Supabase local, aplica migraciones y corre pgTAP.
  #
  # Las pruebas pgTAP son la evidencia de calificación operacional del sistema
  # (CLAUDE.md §2). Este job es el que bloquea el merge cuando una regla de
  # negocio deja de cumplirse, incluida la prueba de arquitectura que verifica
  # la dirección de dependencia comercial -> gmp -> core (invariante 7).
  # ---------------------------------------------------------------------------
  base-de-datos:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Solo la base, vacía: las migraciones no las aplica la CLI sino el
      # script, que siembra las cuentas de arranque que algunas cargas
      # necesitan (supabase/tests/aplicar_migraciones.sh). Sin migraciones no
      # hay seed, y los demás servicios (PostgREST pide los esquemas core, gmp
      # y comercial al arrancar) no hacen falta para pgTAP. Solo en esta copia
      # del CI: config.toml queda igual en el repo.
      - name: Levantar Supabase local (solo la base, sin migraciones)
        run: |
          sed -i '/^\[db\.migrations\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verificar que las migraciones aplican en limpio
        run: bash supabase/tests/aplicar_migraciones.sh postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Correr pruebas pgTAP
        # Solo las pruebas: supabase/tests también tiene andamio.sql, que
        # prepara entornos sin Supabase y no es una prueba.
        run: supabase test db supabase/tests/database

      - name: Bajar Supabase local
        if: always()
        run: supabase stop

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, build y el chequeo de service_role.
  #
  # El chequeo de service_role corre DESPUÉS del build, a propósito: así revisa
  # el bundle publicable de dist/ y no sólo las fuentes. Es la invariante 4 de
  # CLAUDE.md §3, verificada sobre el artefacto que efectivamente se despliega.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, typecheck, build, service_role)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: clave-anonima-de-ci

      - name: Chequeo de fuga de service_role
        run: npm run check:service-role
